name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Silent Curl with Retry
        run: |
          for i in {1..3}; do
            curl -s https://cupertino-stories-v1.streamlit.app > /dev/null && break || sleep 10
          done
